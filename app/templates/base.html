<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Calculadora de Opciones{% endblock %} · Opciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23163A6B'/%3E%3Cpath d='M7 22 13 14l5 5 7-10' stroke='%23D4A94A' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('home.index') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 22 13 14l5 5 7-10"/></svg>
        </span>
        <span class="brand-text">
          <strong>Opciones</strong>
          <small>Valoración de derivados</small>
        </span>
      </a>

      {% set endpoint = request.endpoint or '' %}
      <nav class="nav" aria-label="Principal">
        <a href="{{ url_for('home.index') }}" class="nav-link {{ 'active' if endpoint.startswith('home.') }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Inicio
        </a>
        <a href="{{ url_for('binomial.page') }}" class="nav-link {{ 'active' if endpoint.startswith('binomial.') }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="19" cy="4" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="20" r="2"/><path d="m6.7 11 3.6-3M6.7 13l3.6 3M13.7 6l3.6-1.5M13.7 8l3.6 3M13.7 16l3.6-3M13.7 18l3.6 1.5"/></svg>
          Árbol binomial
        </a>
        <a href="{{ url_for('black_scholes.page') }}" class="nav-link {{ 'active' if endpoint.startswith('black_scholes.') }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M4 17c3 0 4-11 8-11s5 11 8 11"/></svg>
          Black-Scholes
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span>Cambiar tema</span>
        </button>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
      <footer class="footer">
        Herramienta educativa. Los resultados dependen de los supuestos de cada modelo y no constituyen asesoría financiera.
      </footer>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
